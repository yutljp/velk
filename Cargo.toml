[package]
name = "velk"
version = "0.1.0"
edition = "2024"
license = "MIT"

[features]
timing = []
fuzzing = []

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
cpp_demangle = "0.5.1"
flate2 = "1.1.10"
gimli = { version = "0.34.0", features = ["read"] }
iced-x86 = "1.21.0"
libc = "0.2"
memchr = "2.8.3"
memmap2 = "0.9.8"
object = { version = "0.40.0", features = ["all"] }
rayon = "1.12.0"
rquickjs = "0.14.0"
rustc-demangle = "0.1.28"
rustc-hash = "2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["raw_value"] }
sha2 = "0.10.8"
thiserror = "2.0.21"
yaxpeax-arch = "0.3"
yaxpeax-arm = "0.5.0"

[build-dependencies]
sha2 = "0.10.8"

[dev-dependencies]
proc-macro2 = { version = "1.0.107", features = ["span-locations"] }
syn = { version = "3.0.9", features = ["full", "visit"] }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.0.7", features = ["fs"] }

[lints.clippy]
question_mark = "allow"
expect_used = "allow"
unreadable_literal = "allow"
exhaustive_enums = "allow"

borrowed_box = "deny"
disallowed_methods = "deny"
doc_markdown = "deny"
expl_impl_clone_on_copy = "deny"
inefficient_to_string = "deny"
len_without_is_empty = "deny"
must_use_candidate = "deny"
ptr_arg = "deny"
redundant_clone = "deny"
ref_option = "deny"
ref_option_ref = "deny"
unnecessary_unwrap = "deny"
unwrap_used = "deny"
wildcard_imports = "deny"
wrong_self_convention = "deny"

allow_attributes_without_reason = "deny"
fn_params_excessive_bools = "deny"
manual_let_else = "deny"
missing_panics_doc = "deny"
needless_for_each = "deny"
rc_buffer = "deny"
string_add = "deny"
undocumented_unsafe_blocks = "deny"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[profile.test]
opt-level = 2
