# Canonical test environment: pinned toolchains on x86-64 Linux, results
# written to tests/out-canonical/. Compare local results (macOS/arm64 etc.)
# against them with tests/env-diff.sh.
#
#   docker compose run --rm canonical        # run the canonical suite
#   docker compose run --rm canonical ./tests/env-diff.sh   # also show the diff
#
# To change versions, override build.args (they map to the ARGs in the Dockerfile):
#   docker compose build --build-arg CLANG_MAJOR=19
services:
  canonical:
    build:
      context: ./docker
      args:
        CLANG_MAJOR: "18"
        RUST_VERSION: "1.98.1"
        GO_VERSION: "1.23.4"
    image: velk-canonical:ubuntu24.04-clang18-rust1.98-go1.23
    platform: linux/amd64
    init: true
    working_dir: /work
    volumes:
      # Sources are mounted read-write; build output goes to named volumes
      # so x86 artifacts stay out of the host target/ and are reused next run.
      - .:/work
      - cargo-registry:/root/.cargo/registry
      - cargo-git:/root/.cargo/git
      - cargo-target:/target
    environment:
      VELK_OUT: tests/out-canonical
      CARGO_TARGET_DIR: /target
      CARGO_TERM_COLOR: never
      # Dependencies may be fetched; the named volumes keep them and the build between runs.
      CARGO_NET_OFFLINE: "false"
      # Timings are meaningless under emulation; benchmark locally instead.
      VELK_BENCH: "0"
      # Per-function pseudo-C dumps only on request, to keep normal runs fast.
      VELK_DUMP: "0"
    command: ["./tests/canonical.sh"]

volumes:
  cargo-registry:
  cargo-git:
  cargo-target:
