# Reference environment: x86-64 Linux with pinned toolchain versions.
#
#   docker compose run --rm fixtures   # rebuild tests/fixtures/ from tests/cases/
#   docker compose run --rm check      # run the test suite on Linux
#
# Change a version with a build argument (they match the Dockerfile ARGs):
#   docker compose build --build-arg CLANG_MAJOR=19
x-reference: &reference
  build:
    context: ./docker
    args:
      CLANG_MAJOR: "18"
      RUST_VERSION: "1.98.1"
      GO_VERSION: "1.23.4"
  image: velk-canonical:ubuntu24.04-clang18-rust1.98-go1.23
  platform: linux/amd64
  init: true
  working_dir: /work

services:
  fixtures:
    <<: *reference
    volumes:
      - .:/work
    command: ["./tests/make_fixtures.sh"]

  check:
    <<: *reference
    volumes:
      - .:/work
      # Build output stays in named volumes, out of the host target/, and is reused next run.
      - cargo-registry:/root/.cargo/registry
      - cargo-git:/root/.cargo/git
      - cargo-target:/target
    environment:
      CARGO_TARGET_DIR: /target
      CARGO_TERM_COLOR: never
      # Timings are meaningless under emulation; benchmark locally instead.
      VELK_BENCH: "0"
    command: ["sh", "-c", "cargo test && ./tests/smoke.sh && ./tests/ladder.sh"]

volumes:
  cargo-registry:
  cargo-git:
  cargo-target:
